name: app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Test and build
        run: |
          export VERSION_CODE=${{ github.run_number }}
          case "$GITHUB_REF" in
            refs/tags/v*) export VERSION_NAME="${GITHUB_REF_NAME#v}" ;;
            *) export VERSION_NAME="0.1-dev.${{ github.run_number }}" ;;
          esac
          gradle --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "matepad-linux-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: matepad-linux-*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" matepad-linux-*.apk \
            --title "MatePad Linux installer $GITHUB_REF_NAME" \
            --notes "Install on HarmonyOS with root (Magisk). See the README."
